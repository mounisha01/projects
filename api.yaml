  LoginLambda1Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LoginLambda3
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: "arn:aws:iam::602482018691:role/LabRole"
      Code:
        # S3Bucket: chequesbucket-0234
        ZipFile: |
          # Add your Python code for LoginLambda here
          # login_lambda.py
          import boto3
          import json

          def lambda_handler(event, context):
              try:
                  # Assuming you have a DynamoDB table named 'Users'
                  dynamodb = boto3.resource('dynamodb')
                  table = dynamodb.Table('users1')

                  # Retrieve username and password from the event
                  username = event['username']
                  password = event['password']

                  # Query the DynamoDB table to check if the user exists and the password is correct
                  response = table.get_item(Key={'username': username})

                  if 'Item' in response:
                      user_data = response['Item']
                      if user_data['password'] == password:
                          return {
                              'statusCode': 200,
                              'body': json.dumps({'message': 'Login successful!'})}
                  return {
                      'statusCode': 401,
                      'body': json.dumps({'message': 'Invalid credentials'})}

              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'message': 'Internal Server Error'})}

      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: UsersDynamoDBTable


  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: testapi

  LambdaLoginPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      FunctionName: !GetAtt LoginLambda1Function.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*"

  ApiGatewayResourceLogin:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: "login"

  LoginOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiGatewayResourceLogin
      HttpMethod: OPTIONS
      Integration:
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              "method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              "method.response.header.Access-Control-Allow-Methods": "'GET,POST,PUT,DELETE'"
              "method.response.header.Access-Control-Allow-Origin": "'*'"
            ResponseTemplates:
              "application/json": ""
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          "application/json": '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Headers": true
            "method.response.header.Access-Control-Allow-Methods": true
            "method.response.header.Access-Control-Allow-Origin": true
          ResponseModels:
            "application/json": "Empty"

  ApiGatewayMethodLogin:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiGatewayResourceLogin
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginLambda1Function.Arn}/invocations"
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: $input.json('$')
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: $input.json('$')
      RequestParameters:
        method.request.querystring.name: false
      MethodResponses:
        - ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          StatusCode: "200"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethodLogin
      - ApiGatewayMethodHome
    Properties:
      RestApiId: !Ref ApiGateway

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      StageName: dev
      Description: Production Stage

#Outputs for the project

  HomeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: HomeLambda3
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: "arn:aws:iam::602482018691:role/LabRole"
      Code:
        ZipFile: |
          # Add your Python code for HomeLambda here
          # Python Lambda function to fetch account details and name from DynamoDB
          import boto3
          import json
          def lambda_handler(event, context):
              dynamodb = boto3.resource('dynamodb')
              table = dynamodb.Table('accounts1')
              # Assuming you have the username in the 'username' field of the event
              username = event['username']

              # Retrieve the item from DynamoDB based on the username
              response = table.get_item(Key={"username": username})

              if 'Item' in response:
                  item = response['Item']
                  account_details = item.get('amount', 'N/A')
                  name = item.get('name', 'N/A')
                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'account_details': account_details,
                          'name': name
                      })
                  }
              else:
                  return {
                      'statusCode': 404,
                      'body': json.dumps({'message': 'User not found'})
                  }

      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: AccountsDynamoDBTable
