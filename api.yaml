AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create a public S3 bucket
Parameters:
  S3BucketArn:
    Type: String
    Description: ARN of the S3 bucket to trigger the Lambda function
Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: chequesbucket-111
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - "PUT"
              - "POST"
              - "DELETE"
              - "GET"
            AllowedOrigins:
              - "*"
            MaxAge: 300 # Allowing public access for demonstration purposes. You may want to configure this securely in a real application.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt UploadAndProcessLambdaFunction.Arn
  AccountsDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: accounts1
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  # DynamoDB Table for the User
  UsersDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users1
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  # Custom resource to insert data into the UserDynamoDBTable
  # InsertUserData:
  #   Type: Custom::InsertUserData
  #   Properties:
  #     ServiceToken: !GetAtt InsertUserDataFunction.Arn
  #     TableName: !Ref UsersDynamoDBTable
      # Item:
      #   username: "admin"
      #   password: "momo"

  # Custom resource to insert data into the AccountDynamoDBTable
  # InsertAccountData:
  #   Type: Custom::InsertAccountData
  #   Properties:
  #     ServiceToken: !GetAtt InsertAccountDataFunction.Arn
  #     TableName: !Ref AccountsDynamoDBTable
      # Item:
      #   username: "admin"
      #   amount: 1000
      #   name: "chequing"

  # Lambda function to handle inserting data into UserDynamoDBTable
  InsertUserDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: InsertUserDataFunction
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: "arn:aws:iam::602482018691:role/LabRole"
      Code:
        ZipFile: |
          import boto3
          def lambda_handler(event, context):
              dynamodb = boto3.resource('dynamodb')
              table = dynamodb.Table('users1')
              table.put_item(Item={"username":"admin","password":"momo"})

  # Lambda function to handle inserting data into AccountDynamoDBTable
  InsertAccountDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: InsertAccountDataFunction
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: "arn:aws:iam::602482018691:role/LabRole"
      Code:
        ZipFile: |
          import boto3
          def lambda_handler(event, context):
              dynamodb = boto3.resource('dynamodb')
              table = dynamodb.Table('accounts1')
              table.put_item(Item={"username":"admin","amount":"1000","name":"chequing"})
    # Wait condition handle
  # WaitHandle:
  #   Type: AWS::CloudFormation::WaitConditionHandle

  # Wait condition to wait for the data insertion
  # WaitCondition:
  #   Type: AWS::CloudFormation::WaitCondition
  #   DependsOn:
  #     - InsertUserData
  #     - InsertAccountData
  #   Properties:
