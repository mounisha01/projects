      Endpoint: mn660371@dal.ca
      Protocol: email
      TopicArn: !Ref SnsTopic

  # S3 Bucket Trigger for UploadAndProcessLambda (Assuming the Lambda function is named UploadAndProcessLambda)
  S3BucketTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ChequesBucket.Arn
      FunctionName: !Ref UploadAndProcessLambda


