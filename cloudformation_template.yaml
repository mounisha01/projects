AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template for your application.
Parameters:
  S3BucketArn:
    Type: String
    Description: ARN of the S3 bucket to trigger the Lambda function
Resources:

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: chequesbucket-02345
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - "PUT"
              - "POST"
              - "DELETE"
              - "GET"
            AllowedOrigins:
              - "*"
            MaxAge: 300 # Allowing public access for demonstration purposes. You may want to configure this securely in a real application.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt UploadAndProcessLambdaFunction.Arn
