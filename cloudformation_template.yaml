  UploadAndProcessLambdaS3Trigger:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UploadAndProcessLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: "arn:aws:s3:::chequesbucket-02345"

  SnsTopic:
    Type: AWS::SNS::Topic

  SnsSubscription:
    Type: AWS::SNS::Subscription
